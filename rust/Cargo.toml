[package]
name = "amtr"
version = "0.4.0"
edition = "2024"
description = "the agentic debugger for Claude Code: live context-window memory map, INSPECT/REPLAY, cache economics, subagent drill-in, compaction post-mortems"
license = "MIT"
repository = "https://github.com/arian-shamaei/anthropometer"
homepage = "https://github.com/arian-shamaei/anthropometer"
readme = "README.md"
keywords = ["claude", "claude-code", "debugger", "agents", "tui"]
categories = ["command-line-utilities", "development-tools::debugging", "development-tools::profiling", "visualization"]
include = ["src/**", "engine/*.py", "README.md"]

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
